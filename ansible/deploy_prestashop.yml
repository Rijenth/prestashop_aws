---
- name: Déploiement de PrestaShop sur AWS
  hosts: prestashop
  become: yes
  gather_facts: yes

  tasks:
    - name: Afficher les informations de l'hôte
      debug:
        msg: "Déploiement sur {{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }})"

    - name: Mettre à jour le cache APT
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Installer les prérequis système
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - netcat
        state: present
        update_cache: yes

    - name: Créer le répertoire pour les clés GPG Docker
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Ajouter la clé GPG officielle de Docker
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Ajouter le dépôt Docker
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Mettre à jour le cache APT après ajout du dépôt Docker
      apt:
        update_cache: yes

    - name: Installer Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Démarrer et activer le service Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Ajouter l'utilisateur ubuntu au groupe docker
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Installer le module Python Docker
      pip:
        name:
          - docker
          - docker-compose
        state: present

    - name: Vérifier que Docker est installé
      command: docker --version
      register: docker_version

    - name: Afficher la version de Docker
      debug:
        msg: "{{ docker_version.stdout }}"

    - name: Se connecter au registry Docker (si credentials fournis)
      docker_login:
        registry_url: "{{ prestashop_registry_url }}"
        username: "{{ prestashop_registry_username }}"
        password: "{{ prestashop_registry_password }}"
      when:
        - prestashop_registry_username | length > 0
        - prestashop_registry_password | length > 0

    - name: Afficher les informations de connexion RDS
      debug:
        msg: "Tentative de connexion à RDS: host={{ db_server }}, port=3306"
      when: db_server != 'changeme.rds.amazonaws.com'

    - name: Attendre que RDS soit accessible (jusqu'à 5 minutes)
      wait_for:
        host: "{{ db_server }}"
        port: 3306
        timeout: 300
        delay: 10
        msg: "Timeout en attendant que RDS soit accessible. Vérifiez que le security group RDS autorise les connexions depuis l'instance EC2."
      when: db_server != 'changeme.rds.amazonaws.com'

    - name: Récupérer l'IP publique de l'instance
      uri:
        url: http://169.254.169.254/latest/meta-data/public-ipv4
        return_content: yes
      register: public_ip_result

    - name: Définir l'IP publique comme variable
      set_fact:
        public_ip: "{{ public_ip_result.content }}"

    - name: Afficher l'IP publique
      debug:
        msg: "IP publique de l'instance: {{ public_ip }}"

    - name: Arrêter et supprimer le conteneur PrestaShop existant (si présent)
      docker_container:
        name: "{{ prestashop_container_name }}"
        state: absent
      ignore_errors: yes

    - name: Créer et démarrer le conteneur PrestaShop
      docker_container:
        name: "{{ prestashop_container_name }}"
        image: "{{ prestashop_image }}"
        state: started
        restart_policy: always
        network_mode: host
        env:
          DB_SERVER: "{{ db_server }}"
          DB_NAME: "{{ db_name }}"
          DB_USER: "{{ db_user }}"
          DB_PASSWD: "{{ db_password }}"
          PS_INSTALL_AUTO: "{{ ps_install_auto | string }}"
          PS_DOMAIN: "{{ public_ip }}"
          PS_FOLDER_ADMIN: "{{ ps_folder_admin }}"
          PS_FOLDER_INSTALL: "{{ ps_folder_install }}"
        volumes:
          - "{{ prestashop_volume }}:/var/www/html"

    - name: Attendre que le conteneur démarre (30 secondes)
      pause:
        seconds: 30

    - name: Vérifier l'état du conteneur PrestaShop
      docker_container_info:
        name: "{{ prestashop_container_name }}"
      register: container_info

    - name: Afficher l'état du conteneur
      debug:
        msg: "Conteneur PrestaShop: {{ container_info.container.State.Status }}"

    - name: Récupérer les logs du conteneur PrestaShop
      command: docker logs {{ prestashop_container_name }}
      register: container_logs

    - name: Afficher les 50 dernières lignes des logs
      debug:
        msg: "{{ container_logs.stdout_lines[-50:] }}"

    - name: Message de succès
      debug:
        msg: |
          ========================================
          Déploiement terminé avec succès !
          ========================================
          Accédez à PrestaShop via: http://{{ public_ip }}
          Admin: http://{{ public_ip }}/{{ ps_folder_admin }}
          ========================================
