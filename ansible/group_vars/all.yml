---
# Variables communes pour le déploiement PrestaShop

# Base de données (surcharge par les outputs Terraform)
db_server: "changeme.rds.amazonaws.com"
db_name: "prestashop"
db_user: "{{ lookup('env', 'TF_VAR_DB_USER') | default('') }}"
db_password: "{{ lookup('env', 'TF_VAR_DB_PASSWORD') | default('') }}"

# Configuration PrestaShop
ps_install_auto: 1
ps_folder_admin: "admin-dev"
ps_folder_install: "install-dev"

# Docker
prestashop_image: "{{ lookup('env', 'ANSIBLE_PRESTASHOP_IMAGE') | default('') }}"
prestashop_container_name: "prestashop"
prestashop_volume: "prestashop-data"

# Redis
redis_enabled: true
redis_image: "redis:7.2-alpine"
redis_container_name: "redis"
redis_conf_dir: "/opt/prestashop/redis"
redis_conf_path: "{{ redis_conf_dir }}/redis.conf"
redis_password: "{{ lookup('env', 'ANSIBLE_REDIS_PASSWORD') | default('') }}"

# Registry (use env vars to avoid storing credentials)
prestashop_registry_url: "registry.gitlab.com"
prestashop_registry_username: "{{ lookup('env', 'ANSIBLE_REGISTRY_USERNAME') | default('') }}"
prestashop_registry_password: "{{ lookup('env', 'ANSIBLE_REGISTRY_PASSWORD') | default('') }}"
