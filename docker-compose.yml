services:
  prestashop:
    build:
      context: .
      dockerfile: ${PRESTASHOP_DOCKERFILE}
    container_name: ${CONTAINER_PREFIX}-prestashop
    ports:
      - "${PRESTASHOP_HTTP_PORT}:80"
    environment:
      DB_SERVER: ${DB_SERVER}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWD: ${DB_PASSWD}
      PS_INSTALL_AUTO: ${PS_INSTALL_AUTO}
      PS_DOMAIN: ${PS_DOMAIN}
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN}
      PS_FOLDER_INSTALL: ${PS_FOLDER_INSTALL}
    volumes:
      - ${PRESTASHOP_VOLUME}:/var/www/html
    depends_on:
      - mysql
      - redis

  mysql:
    image: ${MYSQL_IMAGE}
    container_name: ${CONTAINER_PREFIX}-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ${MYSQL_VOLUME}:/var/lib/mysql
    ports:
      - "${MYSQL_PORT}:3306"

  redis:
    image: ${REDIS_IMAGE}
    container_name: ${CONTAINER_PREFIX}-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ${REDIS_CONF_PATH}:/usr/local/etc/redis/redis.conf:ro
    sysctls:
      net.core.somaxconn: 1024
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  prestashop-data:
    name: ${PRESTASHOP_VOLUME}
  mysql-data:
    name: ${MYSQL_VOLUME}
